name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

# The two builds run in parallel; publish waits for both, so a release never goes out half-built.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$crate" = "$VERSION" ] || { echo "Tag $VERSION doesn't match Cargo.toml version $crate"; exit 1; }

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/syphr-dl \
            target/aarch64-apple-darwin/release/syphr-dl \
            target/x86_64-apple-darwin/release/syphr-dl

      - name: Assemble Syphr.app
        run: |
          app=dist/Syphr.app
          # macOS wants a numeric x.y.z, so a beta tag like v0.1.0-beta.1 becomes 0.1.0.
          short=${VERSION#v}; short=${short%%-*}
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          mv dist/syphr-dl $app/Contents/MacOS/syphr-dl
          cat > $app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Syphr</string>
            <key>CFBundleDisplayName</key><string>Syphr</string>
            <key>CFBundleIdentifier</key><string>dev.tbdsux.syphr-dl</string>
            <key>CFBundleExecutable</key><string>syphr-dl</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$short</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHumanReadableCopyright</key><string>Copyright © 2026 Joshue Abance</string>
          </dict></plist>
          PLIST
          plutil -lint $app/Contents/Info.plist

      # shortcut: ad hoc signature, so Gatekeeper warns on first open; switch to a Developer ID + notarytool once there's an Apple Developer account.
      - name: Sign and package DMG
        run: |
          codesign --force --sign - dist/Syphr.app
          codesign --verify --deep --strict --verbose=2 dist/Syphr.app
          mkdir -p dist/dmg-root
          cp -R dist/Syphr.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname Syphr -srcfolder dist/dmg-root -ov -format UDZO "dist/Syphr-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Syphr-${{ env.VERSION }}.dmg

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # shortcut: unsigned zip, so SmartScreen warns on first open; add an installer and code signing when there's a certificate.
      - name: Build and zip
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/syphr-dl.exe -DestinationPath "dist/Syphr-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Syphr-${{ env.VERSION }}-windows-x64.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(); [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$VERSION" dist/* --repo "${{ github.repository }}" --title "Syphr $VERSION" --generate-notes "${flags[@]}"
