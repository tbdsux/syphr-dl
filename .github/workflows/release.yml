name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$crate" = "$VERSION" ] || { echo "Tag $VERSION doesn't match Cargo.toml version $crate"; exit 1; }

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/syphr-dl \
            target/aarch64-apple-darwin/release/syphr-dl \
            target/x86_64-apple-darwin/release/syphr-dl

      - name: Assemble Syphr.app
        run: |
          app=dist/Syphr.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          mv dist/syphr-dl $app/Contents/MacOS/syphr-dl
          cat > $app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Syphr</string>
            <key>CFBundleDisplayName</key><string>Syphr</string>
            <key>CFBundleIdentifier</key><string>dev.tbdsux.syphr-dl</string>
            <key>CFBundleExecutable</key><string>syphr-dl</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHumanReadableCopyright</key><string>Copyright © 2026 Joshue Abance</string>
          </dict></plist>
          PLIST
          plutil -lint $app/Contents/Info.plist

      # shortcut: ad hoc signature, so Gatekeeper warns on first open; switch to a Developer ID + notarytool once there's an Apple Developer account.
      - name: Sign and package DMG
        run: |
          codesign --force --sign - dist/Syphr.app
          codesign --verify --deep --strict --verbose=2 dist/Syphr.app
          mkdir -p dist/dmg-root
          cp -R dist/Syphr.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname Syphr -srcfolder dist/dmg-root -ov -format UDZO "dist/Syphr-$VERSION.dmg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" "dist/Syphr-$VERSION.dmg" --title "Syphr $VERSION" --generate-notes
