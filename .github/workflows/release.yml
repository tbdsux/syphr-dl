name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

# The builds run in parallel; publish waits for all of them, so a release never goes out half-built.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$crate" = "$VERSION" ] || { echo "Tag $VERSION doesn't match Cargo.toml version $crate"; exit 1; }

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/syphr-dl \
            target/aarch64-apple-darwin/release/syphr-dl \
            target/x86_64-apple-darwin/release/syphr-dl

      - name: Assemble Syphr.app
        run: |
          app=dist/Syphr.app
          # macOS wants a numeric x.y.z, so a beta tag like v0.1.0-beta.1 becomes 0.1.0.
          short=${VERSION#v}; short=${short%%-*}
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          mv dist/syphr-dl $app/Contents/MacOS/syphr-dl
          cp assets/icon/Syphr.icns $app/Contents/Resources/Syphr.icns
          cat > $app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Syphr</string>
            <key>CFBundleDisplayName</key><string>Syphr</string>
            <key>CFBundleIdentifier</key><string>dev.tbdsux.syphr-dl</string>
            <key>CFBundleExecutable</key><string>syphr-dl</string>
            <key>CFBundleIconFile</key><string>Syphr</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$short</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHumanReadableCopyright</key><string>Copyright © 2026 Joshue Abance</string>
            <key>CFBundleURLTypes</key><array><dict>
              <key>CFBundleURLName</key><string>dev.tbdsux.syphr-dl</string>
              <key>CFBundleURLSchemes</key><array><string>syphr</string></array>
            </dict></array>
          </dict></plist>
          PLIST
          plutil -lint $app/Contents/Info.plist

      # shortcut: ad hoc signature, so Gatekeeper warns on first open; switch to a Developer ID + notarytool once there's an Apple Developer account.
      # The -full files add yt-dlp and ffmpeg. The updater matches exact names, so it only ever installs the regular ones;
      # a full build's tools live in the data folder by then (see docs/tools.md).
      - name: Sign and package DMGs
        run: |
          pack() {
            codesign --force --sign - "$1/Syphr.app"
            codesign --verify --deep --strict --verbose=2 "$1/Syphr.app"
            ln -s /Applications "$1/Applications"
            hdiutil create -volname Syphr -srcfolder "$1" -ov -format UDZO "$2"
          }
          mkdir -p dist/dmg-root dist/full-root
          cp -R dist/Syphr.app dist/dmg-root/
          cp -R dist/Syphr.app dist/full-root/
          pack dist/dmg-root "dist/Syphr-$VERSION.dmg"

          dist/Syphr.app/Contents/MacOS/syphr-dl --fetch-tools dist/tools
          for tool in ffmpeg ffprobe; do
            lipo -create -output "dist/tools/$tool" "dist/tools/aarch64/$tool" "dist/tools/x86_64/$tool"
            codesign --force --sign - "dist/tools/$tool"
          done
          rm -rf dist/tools/aarch64 dist/tools/x86_64
          cp -R licenses/. dist/tools/
          cp -R dist/tools dist/full-root/Syphr.app/Contents/Resources/tools
          pack dist/full-root "dist/Syphr-$VERSION-full.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Syphr-${{ env.VERSION }}.dmg
            dist/Syphr-${{ env.VERSION }}-full.dmg

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      # The runner runs out of disk building GPUI; drop preinstalled SDKs it never uses. rmdir is much faster than Remove-Item.
      - shell: cmd
        run: |
          rmdir /s /q C:\Android
          rmdir /s /q "C:\Program Files\dotnet"
          exit /b 0
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # shortcut: unsigned, so SmartScreen warns on first open; add code signing when there's a certificate.
      # The zip is what the in-app updater installs; the NSIS setup is for first installs.
      - name: Build, zip and package installer
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/syphr-dl.exe -DestinationPath "dist/Syphr-$env:VERSION-windows-x64.zip"
          # A GUI-subsystem exe, so PowerShell wouldn't wait for it or see its exit code on its own.
          $fetch = Start-Process target/release/syphr-dl.exe -ArgumentList "--fetch-tools", "dist/tools" -Wait -PassThru
          if ($fetch.ExitCode) { exit 1 }
          Copy-Item licenses/* dist/tools/
          Compress-Archive -Path target/release/syphr-dl.exe, dist/tools -DestinationPath "dist/Syphr-$env:VERSION-windows-x64-full.zip"
          cargo install cargo-packager --version 0.11.8 --locked
          cargo packager --release --formats nsis
          Move-Item dist/pkg/*-setup.exe "dist/Syphr-$env:VERSION-windows-x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Syphr-${{ env.VERSION }}-windows-x64.zip
            dist/Syphr-${{ env.VERSION }}-windows-x64-full.zip
            dist/Syphr-${{ env.VERSION }}-windows-x64-setup.exe

  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      # The runner runs out of disk building GPUI and packaging; drop preinstalled SDKs it never uses.
      - uses: endersonmenezes/free-disk-space@v4.0.1
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev

      # Built on the oldest supported Ubuntu so the binary runs on distros with an older glibc.
      # The tarball is what the in-app updater installs for a bare binary; the AppImage updates itself; the .deb goes through apt.
      - name: Build, tar and package
        env:
          # linuxdeploy is itself an AppImage, and the runner has no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cargo build --release --locked
          mkdir -p dist
          tar -czf "dist/Syphr-$VERSION-linux-x64.tar.gz" -C target/release syphr-dl
          target/release/syphr-dl --fetch-tools dist/tools
          cp -R licenses/. dist/tools/
          tar -czf "dist/Syphr-$VERSION-linux-x64-full.tar.gz" -C target/release syphr-dl -C "$PWD/dist" tools
          cargo install cargo-packager --version 0.11.8 --locked
          cargo packager --release --formats deb,appimage
          mv dist/pkg/*.deb "dist/Syphr-$VERSION-linux-amd64.deb"
          mv dist/pkg/*.AppImage "dist/Syphr-$VERSION-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Syphr-${{ env.VERSION }}-linux-x64.tar.gz
            dist/Syphr-${{ env.VERSION }}-linux-x64-full.tar.gz
            dist/Syphr-${{ env.VERSION }}-linux-amd64.deb
            dist/Syphr-${{ env.VERSION }}-linux-x86_64.AppImage

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The in-app updater only offers releases with SHA256SUMS and checks the download against it.
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          flags=(); [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$VERSION" dist/* --repo "${{ github.repository }}" --title "Syphr $VERSION" --generate-notes "${flags[@]}"
