name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No debug info: CI never debugs, and it shrinks the caches so the three OSes fit under GitHub's 10 GB limit.
env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Builds on a Dev Drive skip Defender's per-file scanning; DEV_DRIVE_WORKSPACE is only set on Windows.
      - if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          workspace-copy: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }} -> target
          # PRs restore main's cache but don't save their own, which would evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - run: cargo fmt --check
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
      - run: cargo test --locked
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
