[package]
name = "syphr-dl"
version = "0.1.0"
edition = "2024"
description = "Download manager for direct links and media pages"
authors = ["Joshue Abance"]
license = "MIT"

[dependencies]
gpui-kit = "0.8.1"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "process", "io-util", "macros"] }

[profile.release]
lto = "thin"
strip = true

