[package]
name = "syphr-dl"
version = "0.3.0-beta.3"
edition = "2024"
description = "Download manager for direct links and media pages"
authors = ["Joshue Abance"]
license = "MIT"

[dependencies]
async-channel = "2.5.0"
gpui-kit = "0.8.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "process", "io-util", "macros"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
lto = "thin"
strip = true


# For `cargo packager` in release.yml (Linux .deb and AppImage, Windows NSIS installer); macOS packs its own DMG.
[package.metadata.packager]
product-name = "Syphr"
identifier = "dev.tbdsux.syphr-dl"
category = "Utility"
copyright = "Copyright © 2026 Joshue Abance"
icons = ["assets/icon/icon.png"]
binaries = [{ path = "syphr-dl", main = true }]
out-dir = "dist/pkg"

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libx11-xcb1", "libxcb1", "libfontconfig1", "libfreetype6", "libvulkan1"]

# Per-user, so the in-app updater can write over the installed exe without admin rights.
[package.metadata.packager.nsis]
installer-mode = "currentUser"
